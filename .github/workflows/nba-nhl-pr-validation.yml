name: NBA/NHL PR validation

on:
  push:
    branches:
      - codex/issue-57-nba-nhl-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nba-nhl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'pytest>=8,<9'
      - name: Compile NBA/NHL readiness modules
        run: |
          python -m compileall -q scripts/league_evidence_preflight.py scripts/diagnose_league_runtime.py scripts/collect_league_evidence.py
      - name: Run NBA/NHL focused regression suite
        run: |
          python -m pytest -q \
            tests/test_league_evidence_preflight.py \
            tests/test_parallax_league_model.py \
            tests/test_parallax_league_model_v2.py \
            tests/test_parallax_nba_nhl_shadow.py \
            tests/test_parallax_unattended.py \
            tests/test_parallax_public_feed.py \
            tests/test_parallax_buy_alerts.py
