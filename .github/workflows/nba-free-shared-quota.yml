name: NBA Free Shared Request Budget
on:
  push:
    branches:
      - codex/nba-free-shared-quota-20261030
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . 'pytest>=8,<9'
      - name: NBA Free shared quota and evidence safety
        run: python -m pytest -q tests/test_bdl_request_budget.py tests/test_parallax_nba_nhl_shadow.py tests/test_league_evidence_preflight.py tests/test_train_league_models_cli.py
      - name: Protect NFL MLB CFB
        env:
          TZ: America/New_York
        run: python -m pytest -q tests/test_parallax_nfl.py tests/test_parallax_live_mlb.py tests/test_parallax_live_cfb.py
