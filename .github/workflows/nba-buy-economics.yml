name: NBA BUY economics candidate
on:
  push:
    branches:
      - codex/nba-buy-economics-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<9'
      - name: Compile code
        run: python -m compileall -q scripts/nba_buy_economics_audit.py scripts/nba_kalshi_fee_preflight.py scripts/nba_calibration_refit_audit.py scripts/nba_calibration_diagnostic.py scripts/nba_training_calibration_audit.py scripts/nba_forward_validation_audit.py scripts/nba_research_season_snapshot.py scripts/nba_daily_cross_source_reconcile.py
      - name: NBA quote economics gate tests
        run: python -m pytest -q tests/test_nba_buy_economics_audit.py tests/test_nba_forward_reconcile.py tests/test_nba_kalshi_fee_preflight.py tests/test_parallax_nba_nhl_shadow.py tests/test_parallax_league_model.py tests/test_parallax_league_model_v2.py tests/test_parallax_public_feed.py tests/test_nba_real_model_release_gate.py tests/test_nba_calibration_refit_audit.py tests/test_nba_calibration_diagnostic.py tests/test_nba_research_season_snapshot.py tests/test_nba_daily_cross_source_reconcile.py tests/test_nba_pmus_tiered_fees.py
      - name: Guard existing NFL fee and sports lanes
        env:
          TZ: America/New_York
        run: python -m pytest -q tests/test_parallax_nfl.py tests/test_parallax_live_mlb.py tests/test_parallax_live_cfb.py
