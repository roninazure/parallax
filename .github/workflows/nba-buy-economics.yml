name: NBA BUY economics candidate
on:
  push:
    branches:
      - codex/nba-buy-economics-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<9'
      - name: Compile code
        run: python -m compileall -q scripts/nba_buy_economics_audit.py scripts/nba_kalshi_fee_preflight.py
      - name: NBA quote economics gate tests
        run: python -m pytest -q tests/test_nba_buy_economics_audit.py tests/test_nba_forward_reconcile.py tests/test_nba_kalshi_fee_preflight.py
