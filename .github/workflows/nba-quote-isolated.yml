name: NBA quote capture isolated candidate

on:
  push:
    branches:
      - fix/nba-quote-capture-isolated-20261106
  pull_request:
    branches:
      - fix/nba-quote-capture-isolated-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nba-quote-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and pytest
        run: python -m pip install -e . 'pytest>=8,<9'
      - name: Compile NBA recorder and scan paths
        run: |
          python -m compileall -q parallax/league_quote_snapshots.py parallax/nba_nhl.py scripts/_league_live_scan.py tests/test_nba_quote_capture_isolated.py
      - name: NBA/NHL quote-capture and scanner regression suite
        env:
          TZ: America/New_York
        run: |
          python -m pytest -q tests/test_nba_quote_capture_isolated.py tests/test_parallax_nba_nhl_shadow.py tests/test_parallax_unattended.py tests/test_parallax_public_feed.py tests/test_parallax_buy_alerts.py
      - name: Preserve NFL/MLB/CFB baseline regressions
        env:
          TZ: America/New_York
        run: |
          python -m pytest -q tests/test_parallax_nfl.py tests/test_parallax_live_mlb.py tests/test_parallax_live_cfb.py
