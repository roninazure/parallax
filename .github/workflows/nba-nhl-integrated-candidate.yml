name: NBA NHL Integrated Release Candidate
on:
  push:
    branches:
      - codex/nba-nhl-integrated-candidate-20261030
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . 'pytest>=8,<9'
      - name: All integrated NBA NHL validation and evidence suites
        run: python -m pytest -q tests/test_bdl_request_budget.py tests/test_league_evidence_preflight.py tests/test_parallax_nba_nhl_shadow.py tests/test_train_league_models_cli.py tests/test_parallax_league_model_v2.py tests/test_reconcile_league_results.py tests/test_nba_nhl_comparative_report.py tests/test_audit_league_forward_holdout.py
      - name: Protected NFL MLB CFB
        env:
          TZ: America/New_York
        run: python -m pytest -q tests/test_parallax_nfl.py tests/test_parallax_live_mlb.py tests/test_parallax_live_cfb.py
