name: NBA Phase 1 reconciliation candidate

on:
  push:
    branches:
      - codex/nba-phase1-reconciliation-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install 'pytest>=8,<9'
      - name: Compile reconciliation
        run: python -m compileall -q scripts/nba_forward_reconcile.py scripts/nba_research_season_snapshot.py
      - name: Run offline NBA reconciliation tests
        run: python -m pytest -q tests/test_nba_forward_reconcile.py tests/test_nba_research_season_snapshot.py
