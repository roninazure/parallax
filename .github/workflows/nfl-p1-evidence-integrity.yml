name: NFL P1 evidence integrity verification

on:
  push:
    branches:
      - fix/p1-nfl-evidence-integrity-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-evidence-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test requirements
        run: python -m pip install -e . pytest
      - name: Compile affected modules
        run: python -m py_compile parallax/nfl.py sports/fair_value.py sports/odds_provider.py tests/test_nfl_evidence_integrity.py
      - name: Run NFL and odds related regression suites on UTC runner
        env:
          TZ: UTC
        run: python -m pytest -q tests/test_nfl_evidence_integrity.py tests/test_sports_fair_value.py tests/test_sports_odds_provider.py tests/test_parallax_nfl.py tests/test_parallax_public_feed.py
