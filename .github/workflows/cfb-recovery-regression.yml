name: CFB recovery regression checks

on:
  push:
    branches:
      - fix/cfb-reserve-kalshi-book-budget-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cfb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -e . 'pytest>=8,<9'
      - name: Validate production recovery shell syntax
        run: bash -n scripts/finish_cfb_recovery.sh
      - name: Run CFB regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/test_cfb_kalshi_discovery_budget.py tests/test_parallax_live_cfb.py tests/test_parallax_cfb.py

      - name: Validate actual NFL-baseline overlay used by production cutover
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin eeb1c6215e880efc2cb0446b0e174d01886ec416
          git worktree add --detach /tmp/cfb-production-overlay eeb1c6215e880efc2cb0446b0e174d01886ec416
          for path in scripts/cfb_live_scan.py parallax/data/cfb_pmus_team_codes.json tests/test_cfb_kalshi_discovery_budget.py tests/test_parallax_live_cfb.py; do
            mkdir -p "/tmp/cfb-production-overlay/$(dirname "$path")"
            cp "$GITHUB_WORKSPACE/$path" "/tmp/cfb-production-overlay/$path"
          done
          cd /tmp/cfb-production-overlay
          PYTHONPATH=/tmp/cfb-production-overlay python -m pytest -q tests/test_cfb_kalshi_discovery_budget.py tests/test_parallax_live_cfb.py tests/test_parallax_cfb.py tests/test_parallax_nfl.py
