name: NBA isolated Kalshi fee preflight
on:
  push:
    branches:
      - release/nba-fee-evidence-isolated-20261107
  pull_request:
    paths:
      - scripts/nba_kalshi_fee_preflight.py
      - tests/test_nba_kalshi_fee_preflight.py
      - tests/test_nba_pmus_tiered_fees.py
      - tests/test_nba_kalshi_series_discovery.py
      - scripts/_league_live_scan.py
      - parallax/fees.py
      - parallax/nba_nhl.py
      - .github/workflows/nba-fee-preflight-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-fee-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m compileall -q scripts/nba_kalshi_fee_preflight.py
      - run: python -m pytest -q tests/test_nba_kalshi_fee_preflight.py tests/test_nba_pmus_tiered_fees.py tests/test_nba_kalshi_series_discovery.py tests/test_parallax_nba_nhl_shadow.py
      - name: Guard NFL MLB and CFB production lanes
        env:
          TZ: America/New_York
        run: python -m pytest -q tests/test_parallax_nfl.py tests/test_parallax_live_mlb.py tests/test_parallax_live_cfb.py
