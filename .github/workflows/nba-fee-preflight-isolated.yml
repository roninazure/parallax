name: NBA isolated Kalshi fee preflight
on:
  push:
    branches:
      - release/nba-fee-evidence-isolated-20261107
  pull_request:
    paths:
      - scripts/nba_kalshi_fee_preflight.py
      - tests/test_nba_kalshi_fee_preflight.py
      - .github/workflows/nba-fee-preflight-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-fee-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m compileall -q scripts/nba_kalshi_fee_preflight.py
      - run: python -m pytest -q tests/test_nba_kalshi_fee_preflight.py
